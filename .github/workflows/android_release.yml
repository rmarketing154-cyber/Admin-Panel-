name: Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Prepare Signing Keystore
        id: prepare-keystore
        env:
          KEYSTORE_BASE64_VAL: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS_VAL: ${{ secrets.KEY_ALIAS || 'mailfactory_admin' }}
          KEYSTORE_PASSWORD_VAL: ${{ secrets.KEYSTORE_PASSWORD || '@RonyX154' }}
          KEY_PASSWORD_VAL: ${{ secrets.KEY_PASSWORD || '@RonyX154' }}
        run: |
          mkdir -p android/keystore
          if [ -n "$KEYSTORE_BASE64_VAL" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64_VAL" | base64 -d > android/keystore/release.jks
          else
            echo "Generating automated release keystore with password..."
            keytool -genkeypair -v -keystore android/keystore/release.jks \
              -alias "$KEY_ALIAS_VAL" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD_VAL" \
              -keypass "$KEY_PASSWORD_VAL" \
              -dname "CN=MailFactoryAdmin, OU=Admin, O=MailFactory, L=Dhaka, S=Dhaka, C=BD"
          fi
          echo "KEYSTORE_FILE=${GITHUB_WORKSPACE}/android/keystore/release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_VAL" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS_VAL" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD_VAL" >> $GITHUB_ENV

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_CONTENT" ]; then
            if [ -s "android/app/google-services.json" ]; then
              echo "GOOGLE_SERVICES_JSON secret is empty, but found existing google-services.json in the repository. Proceeding with existing file."
            else
              echo "::error::GOOGLE_SERVICES_JSON secret is missing or empty, and no existing google-services.json found! Please configure it in your GitHub Repository Settings -> Secrets and variables -> Actions."
              exit 1
            fi
          else
            if [[ "$GOOGLE_SERVICES_CONTENT" =~ ^\{ ]]; then
              echo "Detected plain-text JSON. Writing directly to android/app/google-services.json..."
              echo "$GOOGLE_SERVICES_CONTENT" > android/app/google-services.json
            else
              echo "Detected Base64 encoded string. Decoding and writing to android/app/google-services.json..."
              echo "$GOOGLE_SERVICES_CONTENT" | base64 -d > android/app/google-services.json
            fi
            
            if [ -s "android/app/google-services.json" ]; then
              echo "Successfully generated google-services.json at android/app/google-services.json!"
            else
              echo "::error::Failed to write google-services.json file!"
              exit 1
            fi
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Execute Task: Build Release APK and Clean Everything Else
        run: |
          cd android
          
          # Task 1: DELETE all previous builds and old .apk / .aab files
          echo "=== Task 1: Deleting previous builds and old artifacts ==="
          rm -rf build app/build app/release .gradle
          find . -type f -name "*.apk" -delete
          find . -type f -name "*.aab" -delete
          
          # Generate clean Gradle wrapper first
          echo "Generating Gradle Wrapper..."
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          
          # Task 2: CLEAN the project
          echo "=== Task 2: Running gradlew clean ==="
          ./gradlew clean --no-daemon
          
          # Task 3: BUILD only Release APK
          echo "=== Task 3: Building Release APK ==="
          ./gradlew :app:assembleRelease --no-daemon --stacktrace > build.log 2>&1 || {
            echo "::error::================ GRADLE BUILD FAILED ================"
            echo "::error::Here are the last 150 lines of the build log:"
            tail -n 150 build.log
            echo "::error::======================================================"
            exit 1
          }
          echo "Build Succeeded!"
          
          # Task 4: FINAL RESULT - Keep ONLY ONE file: app-release.apk and delete all intermediate files
          echo "=== Task 4: Staging final APK and deleting intermediate files ==="
          # Find the generated APK
          TEMP_APK="/tmp/app-release.apk"
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | sort | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Moving generated APK to temporary storage: $APK_PATH"
            cp "$APK_PATH" "$TEMP_APK"
          else
            echo "::error::No APK generated!"
            exit 1
          fi
          
          # Delete all intermediate files/folders (except source code and gradle configuration)
          echo "Cleaning all intermediate build files..."
          rm -rf build app/build .gradle
          
          # Recreate the target directory and restore only the final release APK
          TARGET_DIR="app/build/outputs/apk/release"
          mkdir -p "$TARGET_DIR"
          mv "$TEMP_APK" "$TARGET_DIR/app-release.apk"
          
          # Task 5: Show the final APK path and size
          echo "=== Task 5: Final APK path and size ==="
          FINAL_PATH="android/$TARGET_DIR/app-release.apk"
          echo "Final APK Path: $FINAL_PATH"
          echo "Final APK Size:"
          ls -lh "$TARGET_DIR/app-release.apk"
          
          # Export path for subsequent upload-artifact steps
          echo "FINAL_APK_PATH=${FINAL_PATH}" >> $GITHUB_ENV

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
