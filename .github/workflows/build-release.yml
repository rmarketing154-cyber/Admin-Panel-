name: Build & Release Android Admin App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Prepare Signing Keystore
        id: prepare-keystore
        run: |
          mkdir -p android/keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore/release.jks
          else
            echo "Generating automated release keystore with password @RonyX154..."
            keytool -genkey -v -keystore android/keystore/release.jks \
              -alias "${{ secrets.KEY_ALIAS || 'mailfactory_admin' }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.KEYSTORE_PASSWORD || '@RonyX154' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || '@RonyX154' }}" \
              -dname "CN=MailFactoryAdmin, OU=Admin, O=MailFactory, L=Dhaka, S=Dhaka, C=BD"
          fi
          echo "KEYSTORE_FILE=${GITHUB_WORKSPACE}/android/keystore/release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || '@RonyX154' }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'mailfactory_admin' }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || '@RonyX154' }}" >> $GITHUB_ENV

      - name: Prepare google-services.json
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is missing or empty! Please configure it in your GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          
          # Detect if secret is base64 or plain text
          SECRET_CONTENT='${{ secrets.GOOGLE_SERVICES_JSON }}'
          if [[ "$SECRET_CONTENT" =~ ^\{ ]]; then
            echo "Detected plain-text JSON. Writing directly to android/app/google-services.json..."
            echo "$SECRET_CONTENT" > android/app/google-services.json
          else
            echo "Detected Base64 encoded string. Decoding and writing to android/app/google-services.json..."
            echo "$SECRET_CONTENT" | base64 -d > android/app/google-services.json
          fi
          
          # Verify file exists and is not empty
          if [ -s "android/app/google-services.json" ]; then
            echo "Successfully generated google-services.json at android/app/google-services.json!"
          else
            echo "::error::Failed to write google-services.json file!"
            exit 1
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Generate and Update Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew || true

      - name: Build Release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and Stage Release APK
        id: stage-apk
        run: |
          mkdir -p release-output
          APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | sort | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" release-output/app-release.apk
            ls -la release-output/app-release.apk
            echo "APK_READY=true" >> $GITHUB_OUTPUT
          else
            echo "ERROR: No APK generated! Searching all directories:"
            find android/app/build -type f || true
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailfactory-admin-release-apk
          path: release-output/app-release.apk
          retention-days: 30

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.release_version }}"
            TAG_NAME="${INPUT_TAG:-v1.0.0}"
            echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            echo "TAG_NAME=v1.0.0-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        if: steps.stage-apk.outputs.APK_READY == 'true'
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: Mail Factory Admin ${{ steps.vars.outputs.TAG_NAME }}
          body: |
            ## 📱 Mail Factory Pro Admin App - Release ${{ steps.vars.outputs.TAG_NAME }}
            
            ### ✨ Included Features:
            - **Firebase Cloud Messaging (FCM)** real-time push notifications
            - High-priority channels: Gmails, Withdrawals, New Users, Reports
            - Background, Foreground, and Closed state notification delivery
            - Android 13+ runtime notification permissions support
            - Deep linking: Tapping notifications opens exact admin page/section
            - In-App Admin Notification Preferences (Toggle by alert type)
            - Secure device token management and deduplication
            
            ### 📥 Download APK:
            Download the `app-release.apk` below and install it directly on your Android phone.
          files: |
            release-output/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
