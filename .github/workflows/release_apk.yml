name: Build and Release Secure Admin APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create google-services.json
        run: |
          mkdir -p android/app
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "889959520630",
              "firebase_url": "https://exchanger-pro-default-rtdb.firebaseio.com",
              "project_id": "exchanger-pro",
              "storage_bucket": "exchanger-pro.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:889959520630:android:f91b1e65865bc68c1f8257",
                  "android_client_info": {
                    "package_name": "com.mailfactory.admin"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "889959520630-c34sg26q9qnb7umdkeedv6ii6rak7fn8.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyCz4g0_N7If9lSs-f1oo-k9Yj-8EvKKu2M"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "889959520630-c34sg26q9qnb7umdkeedv6ii6rak7fn8.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Bundle Local Assets & Build
        run: |
          if [ -d "android" ]; then
            cd android
          fi

          # লেআউট ফিক্স (শুধুমাত্র ক্র্যাশ আটকানোর জন্য)
          find . -type f -name "*.xml" -exec sed -i 's/app:textColorHint/android:textColorHint/g' {} +
          find . -type f -name "*.xml" -exec sed -i 's/ textColorHint=/ android:textColorHint=/g' {} +

          # Build the Web App using Vite to get standard JS/CSS bundles.
          cd ..
          npm install
          npm run build
          cd android

          # রুটের মূল কোডটিকে সরাসরি অ্যান্ড্রয়েডের লোকাল অ্যাসেটে ইন্টিগ্রেট করা
          mkdir -p app/src/main/assets
          
          # Copy everything from the web build dist to Android assets
          if [ -d "../dist" ]; then
            cp -r ../dist/* app/src/main/assets/
          elif [ -f "../index.html" ]; then
            # Fallback if no dist
            cp ../index.html app/src/main/assets/index.html
          fi

          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK (v2 & v3 Scheme)
        run: |
          if [ -d "android" ]; then
            cd android
          fi
          
          keytool -genkeypair -v -keystore release.jks -alias adminKey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=MailFactoryAdmin,O=App,C=US"
          RAW_APK=$(find . -name "*release*.apk" | grep -v "unaligned" | head -n 1)
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RAW_APK" aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks --ks-pass pass:123456 --key-pass pass:123456 --ks-key-alias adminKey --out MailFactory-Admin.apk aligned.apk

          mkdir -p output
          cp MailFactory-Admin.apk output/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-admin-${{ github.run_number }}
          name: MailFactory Admin v${{ github.run_number }}
          files: android/output/MailFactory-Admin.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
