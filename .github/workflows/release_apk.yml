name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto Fix Layout Error & Build APK
        run: |
          if [ -d "android" ]; then
            cd android
          fi
          
          # XML এরর ফিক্স
          find . -type f -name "*.xml" -exec sed -i 's/app:textColorHint/android:textColorHint/g' {} +
          find . -type f -name "*.xml" -exec sed -i 's/ textColorHint=/ android:textColorHint=/g' {} +

          # google-services.json তৈরি
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "mailfactory-admin",
              "storage_bucket": "mailfactory-admin.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.mailfactory.admin"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForSuccessfulBuildOnly12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK with v2/v3 Signing Scheme (apksigner)
        run: |
          # Keystore তৈরি
          keytool -genkeypair -v -keystore release.jks -alias mailKey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=MailFactory,O=App,C=US"

          # APK খুঁজে বের করা
          RAW_APK=$(find . -name "*release*.apk" | head -n 1)
          
          # Android Build Tools থেকে apksigner ও zipalign খুঁজে বের করা
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          # Zipalign করা
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RAW_APK" aligned.apk
          
          # v2 & v3 স্কিমে Sign করা
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks --ks-pass pass:123456 --key-pass pass:123456 --ks-key-alias mailKey --out MailFactory-Admin.apk aligned.apk

          mkdir -p output
          cp MailFactory-Admin.apk output/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MailFactory Admin v1.0.${{ github.run_number }}
          files: output/MailFactory-Admin.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
