name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Environment, Wrapper & Build APK
        run: |
          if [ -d "android" ]; then
            cd android
          fi
          
          # সঠিক প্যাকেজ নেম (com.mailfactory.admin) দিয়ে google-services.json তৈরি
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "mailfactory-admin",
              "storage_bucket": "mailfactory-admin.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.mailfactory.admin"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForSuccessfulBuildOnly12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          # মিসিং র‍্যাপার তৈরি করা
          gradle wrapper
          chmod +x gradlew
          
          # APK বিল্ড করা
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        run: |
          KEYSTORE_PATH="temp.jks"
          keytool -genkeypair -v -keystore $KEYSTORE_PATH -alias releaseKey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android,O=Android,C=US"
          
          APK=$(find . -name "*release*.apk" | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore $KEYSTORE_PATH -storepass android -keypass android "$APK" releaseKey
          
          mkdir -p output
          cp "$APK" output/MailFactory-Admin-release.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MailFactory Admin v1.0.${{ github.run_number }}
          files: output/MailFactory-Admin-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
