name: Auto Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Sign & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Locate Project & Build Release APK
        run: |
          # build.gradle বা settings.gradle ফাইলটি কোন ডিরেক্টরিতে আছে তা খুঁজে বের করা
          BUILD_DIR=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
          echo "Building in directory: $BUILD_DIR"
          cd "$BUILD_DIR"
          
          # gradlew না থাকলে বা পারমিশন না থাকলে সেটআপ করা
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Sign APK & Prepare Artifact
        run: |
          KEYSTORE_PATH="temp-release-key.jks"
          keytool -genkeypair -v -keystore $KEYSTORE_PATH -alias releaseKey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android,O=Android,C=US"
          
          # জেনারেট হওয়া APK খুঁজে বের করা
          APK_PATH=$(find . -type f -name "*.apk" | grep -E "release|unsigned" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "No APK found after build!"
            exit 1
          fi
          
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore $KEYSTORE_PATH -storepass android -keypass android "$APK_PATH" releaseKey
          
          mkdir -p release_output
          cp "$APK_PATH" release_output/app-release.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: release_output/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
