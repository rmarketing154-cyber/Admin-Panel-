name: Auto Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build, Align, and Sign APK
        id: build_process
        run: |
          # 1. Build the Release APK
          echo "Building Release APK via Gradle..."
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          cd ..

          # 2. Locate the Built APK
          RAW_APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "::error::No APK generated by Gradle!"
            exit 1
          fi
          echo "Found raw APK: $RAW_APK"

          # 3. Generate Temporary Zero-Setup Keystore
          echo "Generating temporary ephemeral keystore..."
          keytool -genkey -v -keystore auto-temp.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias autoalias -dname "CN=AutoBuild, OU=DevOps, O=Auto, L=Cloud, S=Internet, C=US" -storepass "autopassword" -keypass "autopassword"

          # 4. Find Android Build Tools (Zipalign & Apksigner)
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          # 5. Determine Release Tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            # Fallback for branch pushes or manual triggers
            RELEASE_TAG="build-$(date +'%Y%m%d-%H%M')"
          fi
          
          ALIGNED_APK="app-aligned.apk"
          FINAL_APK="app-${RELEASE_TAG}-release-signed.apk"

          # 6. Zipalign the APK (Optimization required before signing)
          echo "Aligning APK..."
          "$ZIPALIGN" -v -f -p 4 "$RAW_APK" "$ALIGNED_APK"

          # 7. Sign the APK with apksigner
          echo "Signing APK with apksigner..."
          "$APKSIGNER" sign --ks auto-temp.keystore --ks-pass pass:autopassword --ks-key-alias autoalias --key-pass pass:autopassword --out "$FINAL_APK" "$ALIGNED_APK"

          # Verify Signature
          "$APKSIGNER" verify "$FINAL_APK"
          
          # Export Outputs for GitHub Release Step
          echo "tag_name=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "apk_path=${FINAL_APK}" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_process.outputs.tag_name }}
          name: "Release ${{ steps.build_process.outputs.tag_name }}"
          files: ${{ steps.build_process.outputs.apk_path }}
          body: |
            🚀 **Automated APK Release**
            
            This production-ready build was entirely automated via zero-manual-setup CI/CD pipelines.
            
            - **Triggered By**: `${{ github.event_name }}`
            - **Commit Ref**: `${{ github.sha }}`
            - **Security**: Signed automatically with an ephemeral runner-generated keystore.
            
            📥 Download the attached `.apk` file below to install.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
