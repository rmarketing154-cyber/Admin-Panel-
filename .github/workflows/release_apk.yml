name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Wrapper and Build APK
        run: |
          if [ -d "android" ]; then
            cd android
          fi
          
          # মিসিং র‍্যাপার তৈরি করা
          gradle wrapper
          chmod +x gradlew
          
          # APK বিল্ড কমান্ড
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        run: |
          KEYSTORE_PATH="temp.jks"
          keytool -genkeypair -v -keystore $KEYSTORE_PATH -alias releaseKey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android,O=Android,C=US"
          
          APK=$(find . -name "*release*.apk" | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore $KEYSTORE_PATH -storepass android -keypass android "$APK" releaseKey
          
          mkdir -p output
          cp "$APK" output/app-release.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-build-${{ github.run_number }}
          name: App Release v${{ github.run_number }}
          files: output/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
